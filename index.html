<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lightweight Animated Flower</title>
  <style>
    :root {
      --size: min(60vmin, 520px);
      --petals: 12;
      --bg-1: #0b1a2e;
      --bg-2: #112d48;
      --petal-1: #ff8fb1;
      --petal-2: #ff5f8a;
      --glow: #ffba6b;
      color: #e8f1ff;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, rgba(255, 220, 200, 0.06), transparent 35%),
        radial-gradient(circle at 80% 10%, rgba(255, 196, 255, 0.06), transparent 35%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      overflow: hidden;
      text-align: center;
      padding: 2.5rem 1.25rem 3rem;
      line-height: 1.6;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.25rem;
      max-width: 1100px;
    }

    .garden {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      width: 100%;
      align-items: center;
    }

    .flower {
      position: relative;
      width: var(--size);
      height: var(--size);
      filter: drop-shadow(0 18px 25px rgba(0, 0, 0, 0.45));
      animation: slow-spin 24s linear infinite;
    }

    .ring {
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 60%);
      animation: pulse 6s ease-in-out infinite;
      pointer-events: none;
    }

    .petal {
      --turn: calc(var(--i) * (360deg / var(--petals)));
      position: absolute;
      left: 50%;
      top: 50%;
      width: 20%;
      height: 36%;
      transform-origin: 50% 95%;
      transform: rotate(var(--turn)) translate(-50%, -95%) scale(0.9);
      border-radius: 52% 52% 48% 48%;
      background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 55%),
        linear-gradient(140deg, var(--petal-1), var(--petal-2));
      box-shadow: 0 0 18px rgba(255, 95, 138, 0.35);
      animation: bloom 4.8s ease-in-out infinite alternate;
    }

    .petal:nth-child(even) {
      animation-delay: -1.2s;
      filter: brightness(1.05);
    }

    .petal:nth-child(3n) {
      animation-delay: -2s;
    }

    .core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 24%;
      height: 24%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffd8a8, #ffba6b 55%, #d06f26 80%);
      box-shadow: 0 0 30px rgba(255, 186, 107, 0.75);
      animation: pulse-core 5.6s ease-in-out infinite;
    }

    .geometric {
      --size: min(52vmin, 420px);
      --petals: 16;
      --petal-1: #7dd3fc;
      --petal-2: #38bdf8;
      --bg-1: rgba(109, 219, 255, 0.08);
      --bg-2: rgba(56, 189, 248, 0.18);
      animation: slow-spin 18s linear infinite reverse;
      background: radial-gradient(circle at 50% 50%, var(--bg-2), transparent 58%);
      border-radius: 18%;
      overflow: hidden;
    }

    .geometric .ring {
      inset: 10%;
      border-radius: 22%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.12), transparent 62%);
      animation: pulse 8s ease-in-out infinite;
    }

    .geometric .petal {
      width: 26%;
      height: 26%;
      transform-origin: 50% 50%;
      transform: rotate(var(--turn)) translate(-50%, -50%) scale(0.92);
      clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
      background: linear-gradient(145deg, var(--petal-1), var(--petal-2));
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.35);
      animation: bloom-geo 3.6s ease-in-out infinite alternate;
    }

    .geometric .petal:nth-child(odd) {
      filter: brightness(1.15);
    }

    .geometric .core {
      width: 18%;
      height: 18%;
      background: radial-gradient(circle at 40% 40%, #e0f2fe, #bae6fd 55%, #0ea5e9 80%);
      box-shadow: 0 0 28px rgba(14, 165, 233, 0.7);
    }

    .geometric .stem {
      width: 12%;
      height: 40%;
      background: linear-gradient(180deg, #7ee0a7, #238d5f);
    }

    .geometric .leaf {
      width: 42%;
      background: linear-gradient(120deg, #55cf9a, #1b7d58);
      border-radius: 10% 80% 60% 30%;
      top: 70%;
    }

    .geometric .leaf.right {
      transform: translate(-2%, -20%) rotate(14deg) scale(0.86);
    }

    .geometric .leaf.left {
      transform: translate(-88%, -14%) rotate(-194deg) scale(0.86);
    }

    .stem {
      position: absolute;
      width: 14%;
      height: 38%;
      left: 50%;
      top: 64%;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(180deg, #7fe177, #3d9b55);
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.35));
    }

    .leaf {
      position: absolute;
      width: 45%;
      height: 18%;
      background: linear-gradient(120deg, #73d88c, #2d9c61);
      border-radius: 0 65% 65% 0;
      top: 72%;
      left: 50%;
      transform-origin: left center;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.25));
    }

    .leaf.right {
      transform: translate(-8%, -30%) rotate(22deg) scale(0.92);
    }

    .leaf.left {
      transform: translate(-92%, -30%) rotate(-202deg) scale(0.92);
    }

    .caption {
      max-width: 600px;
      font-size: 1rem;
      color: rgba(232, 241, 255, 0.92);
    }

    .caption strong {
      color: #ffd8a8;
    }

    @keyframes bloom {
      0% {
        transform: rotate(var(--turn)) translate(-50%, -96%) scale(0.88);
        opacity: 0.92;
      }
      100% {
        transform: rotate(var(--turn)) translate(-50%, -103%) scale(1.04);
        opacity: 1;
      }
    }

    @keyframes slow-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0% {
        opacity: 0.35;
        transform: scale(0.98);
      }
      100% {
        opacity: 0.6;
        transform: scale(1.02);
      }
    }

    @keyframes pulse-core {
      0% {
        transform: translate(-50%, -50%) scale(0.96);
      }
      100% {
        transform: translate(-50%, -50%) scale(1.02);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .flower {
        animation-duration: 60s;
      }
      .petal,
      .ring,
      .core {
        animation-duration: 10s;
      }
    }

    @keyframes bloom-geo {
      0% {
        transform: rotate(var(--turn)) translate(-50%, -52%) scale(0.86);
        opacity: 0.94;
      }
      100% {
        transform: rotate(var(--turn)) translate(-50%, -48%) scale(1.05);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="garden">
      <section class="flower" aria-label="Animated flower made of softly spinning petals">
        <div class="ring" aria-hidden="true"></div>
        <div class="stem" aria-hidden="true"></div>
        <div class="leaf left" aria-hidden="true"></div>
        <div class="leaf right" aria-hidden="true"></div>
        <div class="petal" style="--i: 0" aria-hidden="true"></div>
        <div class="petal" style="--i: 1" aria-hidden="true"></div>
        <div class="petal" style="--i: 2" aria-hidden="true"></div>
        <div class="petal" style="--i: 3" aria-hidden="true"></div>
        <div class="petal" style="--i: 4" aria-hidden="true"></div>
        <div class="petal" style="--i: 5" aria-hidden="true"></div>
        <div class="petal" style="--i: 6" aria-hidden="true"></div>
        <div class="petal" style="--i: 7" aria-hidden="true"></div>
        <div class="petal" style="--i: 8" aria-hidden="true"></div>
        <div class="petal" style="--i: 9" aria-hidden="true"></div>
        <div class="petal" style="--i: 10" aria-hidden="true"></div>
        <div class="petal" style="--i: 11" aria-hidden="true"></div>
        <div class="core" aria-hidden="true"></div>
      </section>

      <section class="flower geometric" aria-label="Geometric flower with diamond petals and a stem">
        <div class="ring" aria-hidden="true"></div>
        <div class="stem" aria-hidden="true"></div>
        <div class="leaf left" aria-hidden="true"></div>
        <div class="leaf right" aria-hidden="true"></div>
        <div class="petal" style="--i: 0" aria-hidden="true"></div>
        <div class="petal" style="--i: 1" aria-hidden="true"></div>
        <div class="petal" style="--i: 2" aria-hidden="true"></div>
        <div class="petal" style="--i: 3" aria-hidden="true"></div>
        <div class="petal" style="--i: 4" aria-hidden="true"></div>
        <div class="petal" style="--i: 5" aria-hidden="true"></div>
        <div class="petal" style="--i: 6" aria-hidden="true"></div>
        <div class="petal" style="--i: 7" aria-hidden="true"></div>
        <div class="petal" style="--i: 8" aria-hidden="true"></div>
        <div class="petal" style="--i: 9" aria-hidden="true"></div>
        <div class="petal" style="--i: 10" aria-hidden="true"></div>
        <div class="petal" style="--i: 11" aria-hidden="true"></div>
        <div class="petal" style="--i: 12" aria-hidden="true"></div>
        <div class="petal" style="--i: 13" aria-hidden="true"></div>
        <div class="petal" style="--i: 14" aria-hidden="true"></div>
        <div class="petal" style="--i: 15" aria-hidden="true"></div>
        <div class="core" aria-hidden="true"></div>
      </section>
    </div>

    <p class="caption">
      A lightweight, GPU-friendly flower made from simple shapes and CSS animations. It now includes a second, more geometric
      bloom with diamond petals and its own stem while still running smoothly on <strong>weak computers</strong> thanks to
      minimal markup and no JavaScript.
    </p>
  </main>
</body>
</html>
