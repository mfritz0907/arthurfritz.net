<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UNESCO Quotes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header container">
    <p class="eyebrow">Daily quote</p>
    <h1>UNESCO voices</h1>
    <p class="lead">A fresh quote is pulled each day. When the daily feed is unavailable, a curated list keeps the inspiration going.</p>
    <div class="action-row">
      <a class="button" href="index.html">← Back home</a>
      <span class="badge" id="status">Loading today’s quote…</span>
    </div>
  </header>

  <main class="container">
    <section class="card quote-box" aria-live="polite" aria-atomic="true">
      <p id="quote" class="quote-text">Preparing your quote…</p>
      <p id="source" class="quote-meta"></p>
    </section>
  </main>

  <footer class="footer">
    Quotes update automatically once per day.
  </footer>

  <script>
    const quoteEl = document.getElementById('quote');
    const sourceEl = document.getElementById('source');
    const statusEl = document.getElementById('status');

    const fallbackQuotes = [
      {
        text: 'Since wars begin in the minds of men, it is in the minds of men that the defences of peace must be constructed.',
        url: 'https://www.unesco.org/en/legal-affairs/constitution'
      },
      {
        text: 'UNESCO seeks to build peace through international cooperation in education, the sciences and culture.',
        url: 'https://www.unesco.org/en/overview'
      },
      {
        text: 'Freedom of expression is a fundamental human right and a key enabler of all other rights.',
        url: 'https://www.unesco.org/en/free-speech'
      },
      {
        text: 'Education transforms lives and is at the heart of UNESCO’s mission to build peace, eradicate poverty and drive sustainable development.',
        url: 'https://www.unesco.org/en/education'
      },
      {
        text: 'Culture is who we are and what shapes our identity. No development can be sustainable without it.',
        url: 'https://www.unesco.org/en/culture-and-sustainable-development'
      },
      {
        text: 'Science is our great ally in the quest for peace, sustainable development and human dignity.',
        url: 'https://www.unesco.org/en/natural-sciences'
      },
      {
        text: 'Knowledge shared freely accelerates innovation and narrows inequalities.',
        url: 'https://www.unesco.org/en/open-science'
      },
      {
        text: 'Preserving cultural heritage strengthens community identity and fosters mutual respect.',
        url: 'https://www.unesco.org/en/world-heritage'
      },
      {
        text: 'Education empowers individuals to transform their own lives and the societies around them.',
        url: 'https://www.unesco.org/en/education/sdg4'
      },
      {
        text: 'Media and information literacy equips people to navigate the digital world with confidence and ethics.',
        url: 'https://www.unesco.org/en/media-information-literacy'
      }
    ];

    function dayKey() {
      return new Date().toISOString().slice(0, 10);
    }

    function pickFallbackQuote() {
      const today = new Date();
      const dayIndex = Math.floor(today.getTime() / 86_400_000) % fallbackQuotes.length;
      return fallbackQuotes[dayIndex];
    }

    function renderQuote(entry, sourceLabel = '') {
      quoteEl.textContent = entry.text;
      const label = sourceLabel || (entry.url ? new URL(entry.url).host : 'Source');
      const url = entry.url || '#';
      sourceEl.innerHTML = `Source: <a href="${url}" target="_blank" rel="noopener">${label}</a>`;
    }

    function cacheQuote(entry) {
      try {
        localStorage.setItem('dailyQuote', JSON.stringify({ date: dayKey(), entry }));
      } catch (error) {
        // If storage is blocked, quietly ignore.
      }
    }

    function loadCachedQuote() {
      try {
        const cached = JSON.parse(localStorage.getItem('dailyQuote') || 'null');
        if (cached && cached.date === dayKey()) {
          renderQuote(cached.entry);
          statusEl.textContent = 'Today\'s quote loaded from cache.';
          return true;
        }
      } catch (error) {
        // Ignore storage errors and fall back to fetching.
      }
      return false;
    }

    async function fetchDailyQuote() {
      if (loadCachedQuote()) return;

      statusEl.textContent = 'Loading today’s quote…';
      try {
        const response = await fetch('https://zenquotes.io/api/today');
        if (!response.ok) throw new Error(`Request failed with ${response.status}`);
        const data = await response.json();
        const first = Array.isArray(data) && data[0];
        if (!first || !first.q) throw new Error('Invalid quote format');
        const entry = { text: `${first.q} — ${first.a}`, url: 'https://zenquotes.io' };
        renderQuote(entry, 'zenquotes.io');
        cacheQuote(entry);
        statusEl.textContent = 'Live quote retrieved.';
      } catch (error) {
        const entry = pickFallbackQuote();
        renderQuote(entry);
        cacheQuote(entry);
        statusEl.textContent = 'Using offline quote for today.';
      }
    }

    fetchDailyQuote();
  </script>
</body>
</html>
