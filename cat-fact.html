<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cat Facts</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header container">
    <p class="eyebrow">Animal trivia</p>
    <h1>Curious cat facts</h1>
    <p class="lead">A short feline fact from catfact.ninja, complete with its character count.</p>
    <div class="action-row">
      <a class="button" href="index.html">← Back home</a>
      <button class="button primary" id="refresh">New fact</button>
      <span class="badge" id="status">Loading…</span>
    </div>
  </header>

  <main class="container">
    <section class="card quote-box" aria-live="polite" aria-atomic="true">
      <p id="fact" class="quote-text">Fetching a whisker-filled detail…</p>
      <p id="length" class="quote-meta"></p>
    </section>
  </main>

  <footer class="footer">
    Facts are sourced from catfact.ninja and update on demand.
  </footer>

  <script>
    const factEl = document.getElementById('fact');
    const lengthEl = document.getElementById('length');
    const statusEl = document.getElementById('status');
    const refreshBtn = document.getElementById('refresh');

    async function loadFact() {
      statusEl.textContent = 'Loading…';
      factEl.textContent = 'Fetching a whisker-filled detail…';
      lengthEl.textContent = '';
      try {
        const response = await fetch('https://catfact.ninja/fact');
        if (!response.ok) throw new Error(`Request failed with ${response.status}`);
        const data = await response.json();
        if (!data.fact) throw new Error('No fact returned');
        factEl.textContent = data.fact;
        lengthEl.textContent = `${data.length} characters`; 
        statusEl.textContent = 'Live data';
      } catch (error) {
        factEl.textContent = 'Cats are mysterious, and so is this error. Please try again soon.';
        statusEl.textContent = 'Unable to reach catfact.ninja.';
      }
    }

    refreshBtn.addEventListener('click', loadFact);
    loadFact();
  </script>
</body>
</html>
