<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick Joke</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header container">
    <p class="eyebrow">Laugh break</p>
    <h1>One-liner on demand</h1>
    <p class="lead">A family-friendly joke from the official-joke-api.appspot.com service.</p>
    <div class="action-row">
      <a class="button" href="index.html">← Back home</a>
      <button class="button primary" id="refresh">Another joke</button>
      <span class="badge" id="status">Loading…</span>
    </div>
  </header>

  <main class="container">
    <section class="card quote-box" aria-live="polite" aria-atomic="true">
      <p id="setup" class="quote-text">Setting up something funny…</p>
      <p id="punchline" class="quote-meta"></p>
    </section>
  </main>

  <footer class="footer">
    Jokes are refreshed on click, with a fresh setup and punchline each time.
  </footer>

  <script>
    const setupEl = document.getElementById('setup');
    const punchlineEl = document.getElementById('punchline');
    const statusEl = document.getElementById('status');
    const refreshBtn = document.getElementById('refresh');

    async function loadJoke() {
      statusEl.textContent = 'Loading…';
      setupEl.textContent = 'Setting up something funny…';
      punchlineEl.textContent = '';
      try {
        const response = await fetch('https://official-joke-api.appspot.com/random_joke');
        if (!response.ok) throw new Error(`Request failed with ${response.status}`);
        const data = await response.json();
        if (!data.setup || !data.punchline) throw new Error('Incomplete joke');
        setupEl.textContent = data.setup;
        punchlineEl.textContent = data.punchline;
        statusEl.textContent = 'Live joke';
      } catch (error) {
        setupEl.textContent = 'Our joke machine is taking a nap.';
        punchlineEl.textContent = 'Please try again in a bit.';
        statusEl.textContent = 'Unable to reach the joke API.';
      }
    }

    refreshBtn.addEventListener('click', loadJoke);
    loadJoke();
  </script>
</body>
</html>
